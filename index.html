<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>terrain-gen — procedural island</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="scene"></canvas>

<header id="panel">
  <h1>terrain-gen</h1>
  <div class="row">
    <label for="algo">noise</label>
    <select id="algo">
      <option value="fbm">fractal (fBm)</option>
      <option value="ridged">ridged</option>
      <option value="ds">diamond-square</option>
    </select>
  </div>
  <div class="row">
    <label for="seed">seed</label>
    <input id="seed" type="number" value="1" min="0" step="1">
    <button id="reseed" title="random seed">&#x21bb;</button>
  </div>
  <div class="row">
    <label for="height">height</label>
    <input id="height" type="range" min="2" max="40" step="1" value="18">
    <output id="height-val">18</output>
  </div>
  <div class="row">
    <label for="detail">detail</label>
    <input id="detail" type="range" min="1" max="7" step="1" value="5">
    <output id="detail-val">5</output>
  </div>
  <div class="row">
    <label for="sea">sea</label>
    <input id="sea" type="range" min="0" max="60" step="1" value="30">
    <output id="sea-val">30</output>
  </div>
  <div class="row toggles">
    <label><input id="wire" type="checkbox"> grid</label>
    <label><input id="colors" type="checkbox" checked> colors</label>
  </div>
  <p class="hint">drag to orbit &middot; scroll / pinch to zoom</p>
</header>

<script type="module" src="app.js"></script>
</body>
</html>
